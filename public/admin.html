<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一番賞管理後台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="adminLogin" class="auth-wrap">
    <div class="auth-card">
      <h1>管理員登入</h1>
      <form id="adminLoginForm" class="form-grid">
        <label class="field">帳號<input name="username" required autocomplete="username"></label>
        <label class="field">密碼<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn">登入後台</button>
      </form>
    </div>
  </section>

  <div id="adminApp" class="admin-layout hidden">
    <aside class="sidebar">
      <h2>🎀 管理後台</h2>
      <button data-page="lotteries" class="active">一番賞管理</button>
      <button data-page="players">玩家與印章</button>
      <button data-page="logs">歷史紀錄</button>
      <button id="adminLogout">登出</button>
    </aside>
    <main class="admin-main">
      <section id="lotteriesPage">
        <div class="section-title">
          <h1>一番賞管理</h1>
          <div class="admin-actions">
            <button id="backupBtn" class="btn secondary">⬇ 匯出備份</button>
            <button id="newLottery" class="btn">＋ 建立一番賞</button>
          </div>
        </div>
        <div id="adminLotteryGrid" class="grid"></div>
      </section>
      <section id="playersPage" class="hidden"><h1>玩家與好寶寶印章</h1><div id="playersTable"></div></section>
      <section id="logsPage" class="hidden"><h1>歷史紀錄</h1><div id="logsBox"></div></section>
    </main>
  </div>

  <div id="lotteryModal" class="modal hidden">
    <div class="modal-card lottery-editor-modal">
      <div class="editor-heading">
        <div>
          <p class="eyebrow">ICHIBAN KUJI SETUP</p>
          <h2 id="lotteryModalTitle">建立一番賞</h2>
        </div>
        <button id="cancelLotteryTop" type="button" class="icon-btn" aria-label="關閉">×</button>
      </div>
      <form id="lotteryForm" class="form-grid">
        <input type="hidden" name="id">
        <div class="editor-basic-grid">
          <label class="field">活動名稱<input name="title" required placeholder="例如：女朋友專屬第一彈"></label>
          <label class="field">每抽需要印章<input name="stampCost" type="number" min="1" value="1" required></label>
          <label class="field editor-span-2">活動介紹<textarea name="description" rows="3" placeholder="寫一段可愛的活動介紹"></textarea></label>
          <div class="field editor-span-2">主視覺圖片
            <input id="bannerFile" type="file" accept="image/*">
            <input name="bannerUrl" type="hidden">
            <img id="bannerPreview" class="banner hidden" alt="主視覺預覽">
          </div>
          <label class="field">狀態<select name="status"><option value="draft">草稿</option><option value="published">發布</option><option value="closed">下架</option></select></label>
        </div>

        <div class="prize-editor-toolbar">
          <div><p class="eyebrow">PRIZE LIST</p><h3>獎項設定</h3><p class="helper-text">A賞固定保留，其他獎項可自由新增或刪除。</p></div>
          <button id="addPrize" type="button" class="btn secondary">＋ 新增獎項</button>
        </div>
        <div id="prizeEditor" class="prize-editor"></div>

        <div class="ticket-summary">
          <div><span>總票數</span><strong id="totalTickets">0</strong><small>張</small></div>
          <p id="ticketSummaryText">請設定各獎項數量</p>
        </div>

        <div class="modal-actions sticky-actions">
          <button id="cancelLottery" type="button" class="btn secondary">取消</button>
          <button id="saveLotteryBtn" class="btn">儲存並自動洗牌</button>
        </div>
      </form>
    </div>
  </div>

  <div id="stampModal" class="modal hidden"><div class="modal-card"><h2>調整好寶寶印章</h2><form id="stampForm" class="form-grid"><input name="userId" type="hidden"><p id="stampTarget"></p><label class="field">增加或扣除數量<input name="amount" type="number" required placeholder="例如 10 或 -5"></label><label class="field">原因<input name="reason" placeholder="例如：完成任務"></label><div class="modal-actions"><button type="button" id="cancelStamp" class="btn secondary">取消</button><button class="btn">確認</button></div></form></div></div>
  <script src="/admin.js"></script>
</body>
</html>
