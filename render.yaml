services:
  - type: web
    name: girlfriend-kuji-v3
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: girlfriend-kuji-db
          property: connectionString
      - key: ALLOW_REGISTRATION
        value: true

databases:
  - name: girlfriend-kuji-db
    plan: free
